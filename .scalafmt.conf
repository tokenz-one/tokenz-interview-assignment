version = "3.11.5"

runner.dialect = scala3
runner.dialectOverride.withAllowToplevelTerms = true
runner.dialectOverride.withAllowEndMarker = false
runner.dialectOverride.allowSignificantIndentation = false
runner.dialectOverride.allowStarWildcardImport = true
rewrite.scala3.newSyntax.deprecated = true
rewrite.scala3.convertToNewSyntax = false

maxColumn = 100

assumeStandardLibraryStripMargin = true
align.stripMargin = true
align.arrowEnumeratorGenerator = true

indent.fewerBraces = "never"
align.preset = more

rewrite.rules = [RedundantBraces, SortModifiers, Imports]
rewrite.redundantBraces.stringInterpolation = true
rewrite.redundantBraces.generalExpressions = true
rewrite.redundantBraces.defnBodies = true
rewrite.trailingCommas.style = multiple

rewrite.imports.sort = ascii
rewrite.imports.groups = [
  ["\\$ivy.*"],
  ["\\$packages.*"],
  ["\\$file.*"],
  ["javax?\\..*"],
  ["scala\\..*"],
  [".*"],
  ["tokenz\\..*"]
]

newlines.afterCurlyLambdaParams = squash
newlines.topLevelStatementBlankLines = [
  { blanks { after = 1 } }
  { regex = "^(Defn.*|Term.*|Decl.*)" }
]

importSelectors = binPack
spaces.inImportCurlyBraces=true

danglingParentheses.callSite = true
danglingParentheses.defnSite = true
danglingParentheses.ctrlSite = true
danglingParentheses.tupleSite = true


docstrings.wrap = "no"
